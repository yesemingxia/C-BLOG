# @cuiruoni+Docker Compose 多服务编排：MySQL + Redis + 后端 + 前端(Nginx)
version: "3.8"

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-blog123456}
      MYSQL_DATABASE: blog
    ports:
      - "3307:3306"
      - "33061:33060"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    command: --default-authentication-plugin=mysql_native_password

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    ports:
      - "8089:8089"
    depends_on:
      - mysql
      - redis
    environment:
      - DB_HOST=mysql
      - DB_PORT=33060
      - DB_USER=root
      - DB_PASSWORD=${DB_PASSWORD:-blog123456}
      - DB_NAME=blog
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET:-change-me-to-a-random-secret-min-32-chars}
      # @cuiruoni+阿里云百炼 DashScope API Key（图片风格转换功能）
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-}
    volumes:
      - ./config:/app/config
      # @cuiruoni+风格转换生成图持久化
      - ./uploads:/app/uploads

  frontend:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      # @cuiruoni+HTTPS需先配置证书并启用nginx.conf中的443 server块，再取消以下映射
      # - "443:443"
    depends_on:
      - backend
    volumes:
      - ./source/frontend-source/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  mysql_data:
  redis_data:
