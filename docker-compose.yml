# @cuiruoni+Docker Compose 多服务编排：MySQL + Redis + 后端 + 前端(Nginx)
version: "3.8"

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-blog123456}
      MYSQL_DATABASE: blog
    ports:
      # @cuiruoni+只绑宿主机回环：后端容器走 compose 网络按服务名连 mysql，不经过这两个映射；
      # @cuiruoni+映射只是为了宿主机上的 mysql 客户端/工具。原来写成 "3307:3306"，等于把数据库
      # @cuiruoni+开放到同一网段的所有机器，口令又是 compose 里的开发默认值。
      - "127.0.0.1:3307:3306"
      - "127.0.0.1:33061:33060"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    command: --default-authentication-plugin=mysql_native_password

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      # @cuiruoni+同上：只绑回环。后端容器按服务名 redis:6379 连它，这条映射只服务宿主机调试。
      # @cuiruoni+Redis 里放的是 JWT 黑名单、限流计数和搜索缓存，原来 0.0.0.0:6379 且无口令，
      # @cuiruoni+同一网段任何人都能读写/清空。要再加一层就开 requirepass 并同步 REDIS_PASSWORD。
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    ports:
      # @cuiruoni+只绑宿主机回环：后端唯一的对外路径是 nginx(80)。
      # @cuiruoni+原来写 "8089:8089" 会把端口开放在宿主机所有网卡上，而下面又设了
      # @cuiruoni+TRUST_PROXY_REAL_IP=true —— 能直连 8089 的人每个请求自带一个新 X-Real-IP，
      # @cuiruoni+就等于限流、登录锁定、浏览量去重全部失效（它们都按 IP 分桶）。
      # @cuiruoni+绑 127.0.0.1 后本机 curl/调试照旧可用，外部机器打不进来。
      - "127.0.0.1:8089:8089"
    depends_on:
      - mysql
      - redis
    environment:
      - DB_HOST=mysql
      - DB_PORT=33060
      - DB_USER=root
      - DB_PASSWORD=${DB_PASSWORD:-blog123456}
      - DB_NAME=blog
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # @cuiruoni+改成「未设置就直接拒绝启动」：原来的 ${JWT_SECRET:-change-me-to-...}
      # @cuiruoni+在忘记配环境变量时会带着一个写在公开仓库里的默认密钥起服务，
      # @cuiruoni+HS256 密钥一旦已知，任何人都能自行签发 role=admin 的 token 拿到后台。
      # @cuiruoni+:? 是 compose 的强制变量语法，报错信息比让容器崩在启动守卫里好定位。
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET 必须设置为至少 32 位的随机串，例如 openssl rand -hex 32}
      # @cuiruoni+客户端 IP 口径：nginx.conf 用 $remote_addr 覆写 X-Real-IP，这里才允许后端认账，
      # @cuiruoni+否则所有访客都会被算成 nginx 容器这一个 IP，限流/浏览量去重全挤在同一个桶里。
      # @cuiruoni+前提是只有 nginx 能到后端 —— 上面的端口映射已绑到 127.0.0.1，
      # @cuiruoni+外部机器直连 8089 伪造 X-Real-IP 这条路已经断了；宿主机本机上仍然可以，
      # @cuiruoni+所以这条开关的作用域是「信任本机 nginx」，不要把 8089 再开放到公网网卡。
      - TRUST_PROXY_REAL_IP=true
    volumes:
      - ./config:/app/config
      # @cuiruoni+上传图片/视频持久化
      - ./uploads:/app/uploads

  frontend:
    # @crnl+F10：改为镜像内构建前端（Dockerfile frontend 阶段）。
    # 原先挂宿主机 dist/（被 gitignore），全新克隆起 nginx 是空站点，需手工 npm build
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
    restart: unless-stopped
    ports:
      - "80:80"
      # @cuiruoni+HTTPS需先配置证书并启用nginx.conf中的443 server块，再取消以下映射
      # - "443:443"
    depends_on:
      - backend

volumes:
  mysql_data:
  redis_data:
