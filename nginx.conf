# @cuiruoni+Nginx 反向代理配置：前端静态文件 + 后端API代理 + 安全头
server {
    listen 80;
    server_name localhost;

    # @cuiruoni+前端静态文件
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        # @cuiruoni+index.html 禁止缓存，避免 SPA 更新后浏览器仍引用旧 chunk
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            expires off;
        }

        # @cuiruoni+静态资源缓存（带 hash 的文件名）
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # @cuiruoni+showcase 背景视频 / Background videos
        # 文件名不带 hash，所以不用 immutable —— 换素材后不能让访客拿旧的；
        # 7 天足够，配合 nginx 默认的 Range 支持（video 的 seek 与边下边播依赖 206）。
        location ~* \.(mp4|m4v|webm|ogv|mov)$ {
            expires 7d;
            add_header Cache-Control "public";
        }
    }

    # @cuiruoni+后端API反向代理
    location /api/ {
        proxy_pass http://backend:8089;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # @cuiruoni+请求体大小限制（与后端一致，支持图片上传）
        client_max_body_size 20m;
    }

    # @cuiruoni+B10：视频文件接口单独一条（正则 location 优先于上面的前缀 location）
    #   1) 明确透传 Range/If-Range，保证浏览器拖进度条拿到的是 206 而不是被代理吃掉头；
    #   2) 关掉两端缓冲：206 分块直传，不把整段视频读进 nginx 内存/临时文件；
    #   3) X-Real-IP 由 Nginx 用 $remote_addr 覆写 —— 后端默认不认客户端自带的该头，
    #      只有确认后端不直接对外暴露时才设 trust_proxy_real_ip=true（见 BACKEND_P1P2_FIX.md 8.5）。
    location ~ ^/api/videos/file/ {
        proxy_pass http://backend:8089;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
        proxy_request_buffering off;
        # @cuiruoni+拖播放位置时一个连接可能持续几十秒，别被默认 60s 读超时掐断
        proxy_read_timeout 300s;
    }

    # @cuiruoni+健康检查端点代理（精确匹配，优先于前端）
    location = /health {
        proxy_pass http://backend:8089/;
    }

    # @cuiruoni+安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
