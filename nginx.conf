# @cuiruoni+Nginx 反向代理配置：前端静态文件 + 后端API代理 + 安全头
server {
    listen 80;
    server_name localhost;

    # @cuiruoni+前端静态文件
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        # @cuiruoni+index.html 禁止缓存，避免 SPA 更新后浏览器仍引用旧 chunk
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            expires off;
        }

        # @cuiruoni+静态资源缓存（带 hash 的文件名）
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # @cuiruoni+后端API反向代理
    location /api/ {
        proxy_pass http://backend:8089;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # @cuiruoni+请求体大小限制（与后端一致，支持图片上传）
        client_max_body_size 20m;
    }

    # @cuiruoni+健康检查端点代理（精确匹配，优先于前端）
    location = /health {
        proxy_pass http://backend:8089/;
    }

    # @cuiruoni+安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
